# Home Cams: Wyze camera viewer (live WebRTC video and audio, events by day, groups, power control).
# Production: runs the published image, with no git clone or local build.
# Settings come from .env (see .env.example); HOST and API_PORT are required.

name: home-cams

services:
  home-cams:
    image: ghcr.io/jorcalle11/home-cams:latest
    container_name: home-cams
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      # Inside the container the server listens on every interface, or Docker can't forward
      # traffic to it. .env's HOST only picks where the port is published on the server.
      HOST: 0.0.0.0
    ports:
      - "${HOST:?set HOST in .env}:${API_PORT:?set API_PORT in .env}:${API_PORT}"
    volumes:
      # Wyze token and the SQLite database (the user, sessions and API keys): back it up.
      # Named volume: inherits the image's ownership (the container runs as uid 1000).
      - wyze-token:/app/.wyze

    # Hardening: the only writable paths are the volume and /tmp; no Linux capabilities
    # (it only binds an unprivileged port) and no privilege escalation.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 200
    # Runs node under an init process: SIGTERM reaches it, so `docker compose down` is immediate.
    init: true

    # The healthcheck is in the image (GET /healthz); `docker compose ps` shows "healthy".
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  wyze-token:
