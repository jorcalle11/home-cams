# Wyze camera viewer: live WebRTC video/audio, events by day, groups, power control.
# Production install — pulls the published image only (no git clone, no local build).
# Configure via .env (see .env.example).

name: home-cams

services:
  home-cams:
    image: ghcr.io/jorcalle11/home-cams:latest
    container_name: home-cams
    restart: unless-stopped
    env_file: .env
    # Inside the container it listens on 0.0.0.0:API_PORT. HOST must stay 0.0.0.0 here (overrides
    # env_file): with 127.0.0.1 Docker can't forward traffic into the container.
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
    # HOST and API_PORT from .env (required, no defaults): host address and port where the app is published.
    ports:
      - "${HOST:?set HOST in .env}:${API_PORT:?set API_PORT in .env}:${API_PORT}"
    volumes:
      # Wyze auth token, so restarts don't force a new login (Wyze rate-limits logins).
      # Named volume: inherits the image's ownership (container runs as uid 1000).
      - wyze-token:/app/.wyze
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  wyze-token:
