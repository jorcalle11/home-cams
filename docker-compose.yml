services:
  home-cams:
    build: .
    image: home-cams:latest
    container_name: home-cams
    restart: unless-stopped
    env_file: .env
    # Inside the container it always listens on 0.0.0.0:3001 (overrides env_file).
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3001
    # HOST and PORT from .env: host address and port where the app is published.
    # Defaults to 127.0.0.1:3001 (only reachable from the server, behind an HTTPS proxy).
    ports:
      - "${HOST:-127.0.0.1}:${PORT:-3001}:3001"
    volumes:
      - wyze-token:/app/.wyze

volumes:
  wyze-token:
