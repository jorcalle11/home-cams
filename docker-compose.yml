services:
  home-cams:
    build: .
    image: home-cams:latest
    container_name: home-cams
    restart: unless-stopped
    env_file: .env
    # Inside the container it listens on 0.0.0.0:API_PORT. HOST must stay 0.0.0.0 here (overrides
    # env_file): with 127.0.0.1 Docker can't forward traffic into the container.
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
    # HOST and API_PORT from .env (required, no defaults): host address and port where the app is published.
    ports:
      - "${HOST:?set HOST in .env}:${API_PORT:?set API_PORT in .env}:${API_PORT}"
    volumes:
      - wyze-token:/app/.wyze

volumes:
  wyze-token:
